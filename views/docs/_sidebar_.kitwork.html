    <script>
        (function () {
            const searchIndex = [
                { title: "Getting Started - Core Philosophy", url: "/docs#core-philosophy" },
                { title: "Getting Started - Quick Start", url: "/docs#quick-start" },
                { title: "Getting Started - Installation & Setup", url: "/docs#installation" },

                { title: "Getting Started - Multi-Tenant Architecture", url: "/docs#multi-tenant" },

                { title: "Directory Structure - Serving Assets", url: "/docs/structure#serving-assets" },

                { title: "Routing Basics - Route Parameters", url: "/docs/routing#route-parameters" },
                { title: "Routing Basics - Route Groups", url: "/docs/routing#route-groups" },
                { title: "Routing Basics - Request & Response API", url: "/docs/routing#request-response-api" },
                { title: "Routing Basics - Body Parsing & POST", url: "/docs/routing#body-parsing" },
                { title: "Routing Basics - Custom Headers & Status Codes", url: "/docs/routing#custom-headers" },
                { title: "Template Engine - Template Syntax", url: "/docs/templates#template-syntax" },
                { title: "Template Engine - Layouts & Partials", url: "/docs/templates#layouts-partials" },
                { title: "Template Engine - High Performance Caching", url: "/docs/templates#view-caching" },
                { title: "Template Engine - Data Bindings & Expressions", url: "/docs/templates#bindings-expressions" },
                { title: "Template Engine - Directory Layouts", url: "/docs/templates#directory-layouts" },
                { title: "Template Engine - XSS Escaping & HTML Injection", url: "/docs/templates#xss-escaping" },
                { title: "Query Builder - Retrieving Data", url: "/docs/database#retrieving-data" },
                { title: "Query Builder - Create & Update", url: "/docs/database#create-update" },
                { title: "Query Builder - Advanced Filtering & Scopes", url: "/docs/database#advanced-filtering" },
                { title: "Query Builder - Database Joins & Raw Queries", url: "/docs/database#database-joins" },
                { title: "Query Builder - Transactions & Safety", url: "/docs/database#transactions-safety" },
                { title: "Query Builder - Postgres Driver Configuration", url: "/docs/database#postgres-config" },
                { title: "Concurrency - The go() Function", url: "/docs/async#the-go-function" },
                { title: "Concurrency - Why Goroutines?", url: "/docs/async#why-use-goroutines" },
                { title: "Concurrency - Thread-Safe Database Queries", url: "/docs/async#thread-safe-db" },
                { title: "Concurrency - VM Pool Architecture", url: "/docs/async#vm-pool" },
                { title: "HTTP & Cache - HTTP Client", url: "/docs/http-cache#http-client" },
                { title: "HTTP & Cache - Declarative Caching", url: "/docs/http-cache#route-caching" },
                { title: "HTTP & Cache - Route Flow Hooks", url: "/docs/http-cache#flow-hooks" },
                { title: "Smart QR & Payments - Napas Payload Builder", url: "/docs/payments#napas-spec" },
                { title: "Smart QR & Payments - Designer QR Customization", url: "/docs/payments#qr-styling" },
                { title: "Smart QR & Payments - PNG & SVG Outputs", url: "/docs/payments#qr-output" },
                { title: "Smart QR & Payments - Bank BIN Reference Table", url: "/docs/payments#bank-bins" },
                { title: "Smart QR & Payments - Dynamic Payment Tutorial", url: "/docs/payments#dynamic-payment" },
                { title: "Chrome Automation - Headless Web Capture", url: "/docs/automation#web-capture" },
                { title: "Chrome Automation - Serving Screenshot Streams", url: "/docs/automation#serving-screenshots" },
                { title: "Chrome Automation - Options & Wait Policies", url: "/docs/automation#wait-policies" },
                { title: "Cookbook - E-commerce Store Checkout", url: "/docs/cookbook#ecommerce-checkout" },
                { title: "Cookbook - Auto-reporting Worker", url: "/docs/cookbook#auto-reporting-worker" }
            ];

            const input = document.getElementById('docs-search-input');
            const dropdown = document.getElementById('search-results-dropdown');

            if (!input || !dropdown) return;

            input.addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase().trim();
                if (!val) {
                    dropdown.classList.add('hidden');
                    dropdown.innerHTML = '';
                    return;
                }
                const matches = searchIndex.filter(item => item.title.toLowerCase().includes(val));
                if (matches.length === 0) {
                    dropdown.innerHTML = '<div class="p-3 text-xs text-gray-400 dark:text-slate-500 italic">No results found</div>';
                } else {
                    dropdown.innerHTML = matches.map(item => `
                        <a href="${item.url}" class="block p-3 text-xs text-gray-700 dark:text-slate-300 hover:bg-brand/5 hover:text-brand font-medium transition-colors border-b border-gray-100 dark:border-slate-800/40 last:border-0">
                            ${item.title}
                        </a>
                    `).join('');
                }
                dropdown.classList.remove('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });
        })();
    </script>
